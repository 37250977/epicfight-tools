<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="Indestructible 转 CombatEvolution 格式工具">Indestructible 转 CombatEvolution 格式工具</title>
    <script id="ce-converter-core">
        const COMPARATORS = new Set([
            "greater_absolute", "greater_absolute_contain", "greater_ratio", "greater_ratio_contain",
            "less_absolute", "less_absolute_contain", "less_ratio", "less_ratio_contain"
        ]);
        const CE_CONDITION_TYPES = new Set([
            "combat_evolution:target_in_distance", "combat_evolution:phase_between", "combat_evolution:phase_contain",
            "combat_evolution:entity_tag", "combat_evolution:current_angle", "combat_evolution:health_check",
            "combat_evolution:stamina_check", "combat_evolution:attack_level",
            "combat_evolution:attack_level_contain", "combat_evolution:target_guard_break",
            "epicfight:within_distance"
        ]);
        const COMMON_BEHAVIOR_FIELDS = [
            "priority", "weight", "stopByStun", "interruptType", "interruptedWindow",
            "canInterruptParent", "canInsertGlobalBehavior", "allowedGlobalNameList", "addCoolDown",
            "setCoolDown", "waitTime", "addStamina", "setStamina", "setPhase", "addPhase"
        ];

        function isPlainObject(value) {
            if (value === null || typeof value !== "object" || Array.isArray(value)) return false;
            const proto = Object.getPrototypeOf(value);
            return proto === Object.prototype || proto === null;
        }

        function firstDefined(...values) {
            return values.find(value => value !== undefined && value !== null);
        }

        function normalizeCommand(command) {
            if (typeof command !== "string") return "";
            return command.startsWith("/") ? command : "/" + command;
        }

        function normalizeComparator(value) {
            return COMPARATORS.has(value) ? value : "less_ratio";
        }

        function convertAngleCondition(cond) {
            const min = firstDefined(cond.min, cond.first, 0);
            const max = firstDefined(cond.max, cond.second, 180);
            if (typeof min !== "number" || typeof max !== "number") return null;
            if (cond.side === "left" || cond.side === "right") {
                return { type: "combat_evolution:current_angle", side: cond.side, first: min, second: max };
            }
            if (min <= 0 && max <= 0) {
                return { type: "combat_evolution:current_angle", side: "left", first: Math.min(Math.abs(max), Math.abs(min)), second: Math.max(Math.abs(max), Math.abs(min)) };
            }
            if (min >= 0 && max >= 0) {
                return { type: "combat_evolution:current_angle", side: "right", first: Math.min(min, max), second: Math.max(min, max) };
            }
            const side = Math.abs(min) > Math.abs(max) ? "left" : "right";
            return { type: "combat_evolution:current_angle", side, first: 0, second: side === "left" ? Math.abs(min) : Math.abs(max) };
        }

        function validateSchema(data) {
            if (!isPlainObject(data)) throw new Error("输入 JSON 根必须是普通对象，不能是数组、null 或其他类型");
            const payload = isPlainObject(data.data) ? data.data : data;
            const isConvertible = payload.combat_behavior !== undefined || payload.combatBehaviors !== undefined || payload.attributes !== undefined ||
                payload.humanoid_weapon_motions !== undefined || payload.custom_guard_motion !== undefined ||
                payload.stun_animations !== undefined || payload.default_livingmotions !== undefined ||
                payload.stun_command_list !== undefined || payload.boss_bar !== undefined;
            if (!isConvertible) throw new Error("文件格式不匹配，未检测到可转换字段");
            if (payload.combat_behavior !== undefined && !Array.isArray(payload.combat_behavior)) throw new Error("combat_behavior 必须是数组");
            if (payload.attributes !== undefined && !isPlainObject(payload.attributes) && !Array.isArray(payload.attributes)) throw new Error("attributes 必须是对象或数组");
            if (payload.humanoid_weapon_motions !== undefined && !Array.isArray(payload.humanoid_weapon_motions)) throw new Error("humanoid_weapon_motions 必须是数组");
            if (payload.stun_command_list !== undefined && !Array.isArray(payload.stun_command_list)) throw new Error("stun_command_list 必须是数组");
        }

        function copyJson(value) {
            return JSON.parse(JSON.stringify(value));
        }

        function convertConditions(conditions) {
            if (conditions === undefined) return [];
            if (!Array.isArray(conditions)) return null;
            const converted = [];
            for (const cond of conditions) {
                if (!isPlainObject(cond) || cond.invert === true) return null;
                let type = cond.type || cond.predicate;
                if (typeof type !== "string") return null;
                if (!type.includes(":")) {
                    if (["within_distance", "health", "within_angle", "within_angle_horizontal", "within_eye_height"].includes(type)) type = "epicfight:" + type;
                    else type = "indestructible:" + type;
                }
                if (type === "epicfight:within_eye_height") continue;
                let mapped = null;
                if (type === "epicfight:within_distance" || type === "combat_evolution:target_in_distance") {
                    mapped = { type: "combat_evolution:target_in_distance", min: firstDefined(cond.min, 0), max: firstDefined(cond.max, 0) };
                } else if (type === "epicfight:health" || type === "combat_evolution:health_check") {
                    mapped = { type: "combat_evolution:health_check", health: firstDefined(cond.health, 0), comparator: normalizeComparator(cond.comparator) };
                } else if (type === "indestructible:stamina" || type === "combat_evolution:stamina_check") {
                    mapped = { type: "combat_evolution:stamina_check", stamina: firstDefined(cond.stamina, 0), comparator: normalizeComparator(cond.comparator) };
                } else if (type === "indestructible:attack_level" || type === "combat_evolution:attack_level") {
                    mapped = { type: "combat_evolution:attack_level", min: firstDefined(cond.min, 1), max: firstDefined(cond.max, 1) };
                } else if (type === "indestructible:phase" || type === "combat_evolution:phase_between") {
                    mapped = { type: "combat_evolution:phase_between", min: firstDefined(cond.min, 0), max: firstDefined(cond.max, 0) };
                } else if (type === "indestructible:guard_break" || type === "combat_evolution:target_guard_break") {
                    mapped = { type: "combat_evolution:target_guard_break" };
                } else if (["epicfight:within_angle", "epicfight:within_angle_horizontal", "combat_evolution:current_angle"].includes(type)) {
                    mapped = convertAngleCondition(cond);
                } else if (CE_CONDITION_TYPES.has(type)) {
                    mapped = { ...cond, type };
                    delete mapped.predicate;
                }
                if (!mapped) return null;
                converted.push(mapped);
            }
            return converted;
        }

        function normalizeSimpleEvent(event) {
            if (!isPlainObject(event)) return null;
            const command = normalizeCommand(event.command);
            if (!command) return null;
            return { onTarget: firstDefined(event.onTarget, event.execute_at_target, false), command };
        }

        function convertCommandList(cmdList) {
            if (!Array.isArray(cmdList)) return [];
            const events = [];
            for (const cmd of cmdList) {
                const base = normalizeSimpleEvent(cmd);
                if (!base) continue;
                let type = cmd.type;
                if (!type) type = cmd.time_end !== undefined || cmd.timeEnd !== undefined ? "between_times" : (cmd.time !== undefined ? "in_time" : "tick");
                if (type === "between_times") events.push({ type, timeStart: firstDefined(cmd.timeStart, cmd.time, 0), timeEnd: firstDefined(cmd.timeEnd, cmd.time_end, 0), ...base });
                else if (type === "in_time") events.push({ type, timeStart: firstDefined(cmd.timeStart, cmd.time, 0), ...base });
                else if (type === "tick") events.push({ type, ...base });
            }
            return events;
        }

        function convertHitCommandList(cmdList) {
            if (!Array.isArray(cmdList)) return [];
            const events = [];
            for (const cmd of cmdList) {
                const base = normalizeSimpleEvent(cmd);
                if (!base) continue;
                const type = ["success", "blocked", "missed"].includes(cmd.type) ? cmd.type : "success";
                events.push({ type, phase: firstDefined(cmd.phase, -1), ...base });
            }
            return events;
        }

        function convertBlockedCommandList(cmdList) {
            if (!Array.isArray(cmdList)) return [];
            const events = [];
            for (const cmd of cmdList) {
                const base = normalizeSimpleEvent(cmd);
                if (!base) continue;
                events.push({ parried: firstDefined(cmd.parried, cmd.is_parry, false), phase: firstDefined(cmd.phase, -1), ...base });
            }
            return events;
        }

        function normalizeEventList(value) {
            if (!Array.isArray(value)) return [];
            return value.map(normalizeSimpleEvent).filter(Boolean);
        }

        function normalizeSingleEvent(value, extraFields = []) {
            const base = normalizeSimpleEvent(value);
            if (!base) return null;
            const out = {};
            for (const field of extraFields) if (value[field] !== undefined) out[field] = value[field];
            return { ...out, ...base };
        }

        function getDefaultLivingMotions(data) {
            if (data.default_livingmotions && typeof data.default_livingmotions === 'object' && !Array.isArray(data.default_livingmotions)) {
                return { ...data.default_livingmotions };
            }

            const isHumanoid = firstDefined(data.humanoid, data.isHumanoid, true);
            if (!isHumanoid) return {};

            return {
                idle: "epicfight:biped/living/idle",
                walk: "epicfight:biped/living/walk",
                chase: "epicfight:biped/living/walk",
                mount: "epicfight:biped/living/mount",
                float: "epicfight:biped/living/float",
                fall: "epicfight:biped/living/fall",
                death: "epicfight:biped/living/death"
            };
        }

        function normalizeDamageTags(value) {
            if (!Array.isArray(value)) return [];
            const resourceLocation = /^[a-z0-9_.-]+:[a-z0-9_./-]+$/;
            return value.filter(tag => typeof tag === "string").map(tag => tag.trim()).filter(tag => resourceLocation.test(tag));
        }

        function normalizePhaseParam(value) {
            if (!isPlainObject(value)) return null;
            const out = {};
            for (const field of ["phase", "damageMultiplier", "impactMultiplier", "armorNegationMultiplier", "stunType"]) {
                if (value[field] !== undefined) out[field] = value[field];
            }
            const tags = normalizeDamageTags(firstDefined(value.damage_tags, value.damageTags));
            if (tags.length > 0) out.damage_tags = tags;
            return Object.keys(out).length > 0 ? out : null;
        }

        function normalizeAnimationParams(value) {
            if (!isPlainObject(value)) return {};
            const out = {};
            if (value.transitionTime !== undefined) out.transitionTime = value.transitionTime;
            if (value.playSpeed !== undefined) out.playSpeed = value.playSpeed;
            if (Array.isArray(value.phaseParams)) {
                const phaseParams = value.phaseParams.map(normalizePhaseParam).filter(Boolean);
                if (phaseParams.length > 0) out.phaseParams = phaseParams;
            }
            return out;
        }

        function convertBehavior(b) {
            if (!isPlainObject(b)) return null;
            const typeFlags = [
                b.animation !== undefined,
                b.guard !== undefined || b.guardTime !== undefined,
                b.wander !== undefined || b.wanderTime !== undefined,
                b.guardWithWander !== undefined
            ];
            if (typeFlags.filter(Boolean).length !== 1) return null;

            const outB = {};
            if (typeof b.behaviorName === "string") outB.behaviorName = b.behaviorName;
            for (const field of COMMON_BEHAVIOR_FIELDS) if (b[field] !== undefined) outB[field] = copyJson(b[field]);
            if (b.setPhase === undefined && b.set_phase !== undefined) outB.setPhase = b.set_phase;
            if (b.addStamina === undefined && b.stamina !== undefined) outB.addStamina = -b.stamina;

            const conds = convertConditions(b.conditions);
            if (conds === null) return null;
            if (conds.length > 0) outB.conditions = conds;

            const animationParams = normalizeAnimationParams(b.animationParams);
            if (b.convert_time !== undefined && animationParams.transitionTime === undefined) animationParams.transitionTime = b.convert_time;
            if (b.play_speed !== undefined && animationParams.playSpeed === undefined) animationParams.playSpeed = b.play_speed;

            if (b.animation !== undefined) {
                if (typeof b.animation !== "string" || !b.animation.trim()) return null;
                outB.animation = b.animation;
                const mod = isPlainObject(b.damage_modifier) ? b.damage_modifier : null;
                if (mod) {
                    const phaseParam = { phase: firstDefined(mod.phase, -1) };
                    if (mod.damage !== undefined) phaseParam.damageMultiplier = mod.damage;
                    if (mod.impact !== undefined) phaseParam.impactMultiplier = mod.impact;
                    if (mod.armor_negation !== undefined) phaseParam.armorNegationMultiplier = mod.armor_negation;
                    if (mod.stun_type !== undefined) phaseParam.stunType = mod.stun_type;
                    const tags = normalizeDamageTags(firstDefined(mod.damage_tags, mod.damageTags));
                    if (tags.length > 0) phaseParam.damage_tags = tags;
                    if (Object.keys(phaseParam).length > 1) animationParams.phaseParams = (animationParams.phaseParams || []).concat(phaseParam);
                }
            } else if (typeFlags[1]) {
                outB.guardTime = firstDefined(b.guardTime, b.guard);
                for (const field of ["resetGuardTime", "guardCost", "counterType", "counterChance", "maxGuardHit"]) if (b[field] !== undefined) outB[field] = b[field];
                if (b.counterAnimation !== undefined || b.counter !== undefined) outB.counterAnimation = firstDefined(b.counterAnimation, b.counter);
                if (outB.counterAnimation !== undefined && outB.counterType === undefined) outB.counterType = "random";
                if (outB.counterType === "random" && outB.counterChance === undefined) outB.counterChance = firstDefined(b.counter_chance, 0.25);
                if (b.counter_speed !== undefined && animationParams.playSpeed === undefined) animationParams.playSpeed = b.counter_speed;
            } else if (typeFlags[2]) {
                outB.wanderTime = firstDefined(b.wanderTime, b.wander);
                if (b.strafe !== undefined || b.x_axis !== undefined) outB.strafe = firstDefined(b.strafe, b.x_axis);
                if (b.forward !== undefined || b.z_axis !== undefined) outB.forward = firstDefined(b.forward, b.z_axis);
            } else {
                outB.guardWithWander = b.guardWithWander;
                for (const field of ["guardAnimation", "counterAnimation", "counterType", "counterChance", "maxGuardHit", "forward", "strafe"]) if (b[field] !== undefined) outB[field] = b[field];
                if (outB.counterAnimation !== undefined && outB.counterType === undefined) outB.counterType = "random";
                if (outB.counterType === "random" && outB.counterChance === undefined) outB.counterChance = firstDefined(b.counter_chance, 0.25);
            }
            if (Object.keys(animationParams).length > 0 && (outB.animation !== undefined || outB.guardTime !== undefined || outB.guardWithWander !== undefined)) outB.animationParams = animationParams;

            const timeEvents = convertCommandList(firstDefined(b.timeEvents, b.command_list));
            const hitEvents = convertHitCommandList(firstDefined(b.hitEvents, b.hit_command_list));
            const blockedEvents = convertBlockedCommandList(firstDefined(b.blockedEvents, b.blocked_command_list));
            const onBehaviorStart = normalizeEventList(b.onBehaviorStart).concat(normalizeEventList(b.exBehavior));
            const onHurtEvent = normalizeSingleEvent(b.onHurtEvent, ["returnResult", "damage"]);
            const onGuardHit = normalizeEventList(b.onGuardHit);
            const onCounterStart = normalizeEventList(b.onCounterStart);
            const beforeCounter = normalizeSingleEvent(b.beforeCounter, ["cancelHitAnimation"]);
            if (timeEvents.length > 0) outB.timeEvents = timeEvents;
            if (hitEvents.length > 0) outB.hitEvents = hitEvents;
            if (blockedEvents.length > 0) outB.blockedEvents = blockedEvents;
            if (onBehaviorStart.length > 0) outB.onBehaviorStart = onBehaviorStart;
            if (onHurtEvent) outB.onHurtEvent = onHurtEvent;
            if (onGuardHit.length > 0) outB.onGuardHit = onGuardHit;
            if (beforeCounter) outB.beforeCounter = beforeCounter;
            if (onCounterStart.length > 0) outB.onCounterStart = onCounterStart;

            const branchSource = [];
            if (Array.isArray(b.nextBehaviors)) branchSource.push(...b.nextBehaviors);
            if (Array.isArray(b.children)) branchSource.push(...b.children);
            const branches = branchSource.map(convertBehavior).filter(Boolean);
            if (branches.length > 0) outB.nextBehaviors = branches;
            return outB;
        }

        function convertBehaviorSequence(behaviors, seriesIndex) {
            if (!Array.isArray(behaviors)) return [];
            const converted = behaviors.map(convertBehavior).filter(Boolean);
            for (let i = 0; i < converted.length; i++) {
                if (converted[i].behaviorName === undefined) converted[i].behaviorName = "Action_" + seriesIndex + "_" + i;
                if (i + 1 < converted.length) {
                    converted[i].nextBehaviors = (converted[i].nextBehaviors || []).concat(converted[i + 1]);
                }
            }
            return converted.length > 0 ? [converted[0]] : [];
        }

        function convertStunAnimations(value) {
            if (isPlainObject(value)) return { ...value };
            if (!Array.isArray(value)) return null;
            const out = {};
            for (const entry of value) {
                if (!isPlainObject(entry)) continue;
                const type = firstDefined(entry.stun_type, entry.stunType, entry.type);
                const animation = firstDefined(entry.animation, entry.value);
                if (typeof type === "string" && typeof animation === "string") out[type] = animation;
            }
            return Object.keys(out).length > 0 ? out : null;
        }

        function convertStunEvents(value) {
            if (!Array.isArray(value)) return {};
            const out = {};
            for (const event of value) {
                if (!isPlainObject(event) || typeof event.stun_type !== "string") continue;
                const normalized = normalizeSimpleEvent(event);
                if (!normalized) continue;
                (out[event.stun_type] ||= []).push(normalized);
            }
            return out;
        }

        function normalizeCurrentCombatBehaviors(value) {
            if (!Array.isArray(value)) return [];
            const result = [];
            for (const cb of value) {
                if (!isPlainObject(cb)) continue;
                const weaponCategories = Array.isArray(cb.weaponCategories) ? cb.weaponCategories.filter(item => typeof item === "string" && item.trim()) : [];
                if (weaponCategories.length === 0 || !Array.isArray(cb.behaviorRoots)) continue;
                const behaviorRoots = [];
                for (const root of cb.behaviorRoots) {
                    if (!isPlainObject(root) || !Array.isArray(root.firstBehaviors)) continue;
                    const firstBehaviors = root.firstBehaviors.map(convertBehavior).filter(Boolean);
                    if (firstBehaviors.length === 0) continue;
                    const outRoot = { firstBehaviors };
                    for (const field of ["rootName", "priority", "weight", "maxCooldown", "cooldown", "isGlobal", "backAfterFinished"]) if (root[field] !== undefined) outRoot[field] = copyJson(root[field]);
                    behaviorRoots.push(outRoot);
                }
                if (behaviorRoots.length === 0) continue;
                const outCb = { weaponCategories, style: firstDefined(cb.style, "common"), behaviorRoots };
                if (isPlainObject(cb.stunEvents) && Object.keys(cb.stunEvents).length > 0) outCb.stunEvents = copyJson(cb.stunEvents);
                result.push(outCb);
            }
            return result;
        }

        function convertLegacyCombatBehaviors(data) {
            if (!Array.isArray(data.combat_behavior)) return [];
            const result = [];
            const stunEvents = convertStunEvents(data.stun_command_list);
            for (let idxCb = 0; idxCb < data.combat_behavior.length; idxCb++) {
                const cb = data.combat_behavior[idxCb];
                if (!isPlainObject(cb)) continue;
                if (cb.behavior_series !== undefined && !Array.isArray(cb.behavior_series)) throw new Error("combat_behavior[" + idxCb + "].behavior_series 必须是数组");
                const weaponCategories = Array.isArray(cb.weapon_categories) ? cb.weapon_categories.filter(item => typeof item === "string" && item.trim()) : [];
                if (weaponCategories.length === 0) continue;
                const behaviorRoots = [];
                for (let idxS = 0; idxS < (cb.behavior_series || []).length; idxS++) {
                    const series = cb.behavior_series[idxS];
                    if (!isPlainObject(series)) continue;
                    if (series.behaviors !== undefined && !Array.isArray(series.behaviors)) throw new Error("behavior_series[" + idxS + "].behaviors 必须是数组");
                    const firstBehaviors = convertBehaviorSequence(series.behaviors, idxS);
                    if (firstBehaviors.length === 0) continue;
                    const root = {
                        rootName: firstDefined(series.rootName, "BehaviorRoot_" + idxS),
                        weight: firstDefined(series.weight, 1),
                        maxCooldown: firstDefined(series.maxCooldown, series.cooldown, 0),
                        firstBehaviors
                    };
                    for (const field of ["priority", "isGlobal", "backAfterFinished"]) if (series[field] !== undefined) root[field] = series[field];
                    if (series.maxCooldown !== undefined && series.cooldown !== undefined) root.cooldown = series.cooldown;
                    behaviorRoots.push(root);
                }
                if (behaviorRoots.length === 0) continue;
                const outCb = { weaponCategories, style: firstDefined(cb.style, "common"), behaviorRoots };
                if (Object.keys(stunEvents).length > 0) outCb.stunEvents = copyJson(stunEvents);
                result.push(outCb);
            }
            return result;
        }

        function convertData(input) {
            const nested = isPlainObject(input.data) ? input.data : {};
            const data = { ...nested, ...input };
            delete data.data;
            const out = {};
            const scalarFields = ["faction", "renderer", "model", "armature", "humanoid", "chasingSpeed", "scale", "breakTime", "recoverTime", "staminaRegenDelay", "beParriedDamage", "guardHitImpact", "hurtImpact"];
            for (const field of scalarFields) if (data[field] !== undefined) out[field] = copyJson(data[field]);
            out.faction = firstDefined(out.faction, "neutral");
            out.renderer = firstDefined(out.renderer, "skeleton");
            out.model = firstDefined(out.model, "skeleton");
            out.armature = firstDefined(out.armature, "epicfight:entity/biped");
            out.humanoid = firstDefined(out.humanoid, data.isHumanoid, true);

            for (const field of ["attributes", "weaponLivingMotions", "guardHitAnimation", "stunAnimations", "ceBossBar", "ceBossMusic"]) {
                if (data[field] !== undefined) out[field] = copyJson(data[field]);
            }
            if (isPlainObject(data.attributes)) {
                const attrs = data.attributes;
                if (out.chasingSpeed === undefined && attrs.chasing_speed !== undefined) out.chasingSpeed = attrs.chasing_speed;
                if (out.scale === undefined && attrs.scale !== undefined) out.scale = attrs.scale;
                if (out.staminaRegenDelay === undefined && attrs.stamina_regan_delay !== undefined) out.staminaRegenDelay = attrs.stamina_regan_delay;
                if (out.hurtImpact === undefined && attrs.stamina_lose_multiply !== undefined) out.hurtImpact = attrs.stamina_lose_multiply;
                const mapped = [];
                if (attrs.max_stamina !== undefined) mapped.push({ attribute: "epicfight:staminar", value: attrs.max_stamina });
                if (attrs.stamina_regan_multiply !== undefined) mapped.push({ attribute: "epicfight:stamina_regen", value: attrs.stamina_regan_multiply });
                if (attrs.impact !== undefined) mapped.push({ attribute: "epicfight:impact", value: attrs.impact });
                if (attrs.armor_negation !== undefined) mapped.push({ attribute: "epicfight:armor_negation", value: attrs.armor_negation });
                if (mapped.length > 0) out.attributes = mapped;
                else delete out.attributes;
            }

            if (out.stunAnimations === undefined) {
                const stunAnimations = convertStunAnimations(data.stun_animations);
                if (stunAnimations) out.stunAnimations = stunAnimations;
            }
            if (out.ceBossBar === undefined && data.boss_bar === true) {
                out.ceBossBar = { enableBossBar: true };
                if (data.custom_name !== undefined) out.ceBossBar.bossBarName = data.custom_name;
                if (data.custom_texture !== undefined) out.ceBossBar.bossBarTextures = data.custom_texture;
            }

            if (out.weaponLivingMotions === undefined && Array.isArray(data.humanoid_weapon_motions)) {
                const defaultMotions = getDefaultLivingMotions(data);
                out.weaponLivingMotions = data.humanoid_weapon_motions.map(wm => {
                    if (!isPlainObject(wm)) return null;
                    const weaponCategories = Array.isArray(wm.weapon_categories) ? wm.weapon_categories.filter(item => typeof item === "string" && item.trim()) : [];
                    if (weaponCategories.length === 0) return null;
                    return { weaponCategories, style: firstDefined(wm.style, "common"), livingMotions: { ...defaultMotions, ...(isPlainObject(wm.livingmotions) ? wm.livingmotions : {}) } };
                }).filter(Boolean);
            }
            if (out.guardHitAnimation === undefined && Array.isArray(data.custom_guard_motion)) {
                out.guardHitAnimation = data.custom_guard_motion.map(gm => {
                    if (!isPlainObject(gm)) return null;
                    const weaponCategories = Array.isArray(gm.weapon_categories) ? gm.weapon_categories.filter(item => typeof item === "string" && item.trim()) : [];
                    const animations = Array.isArray(gm.parry_animation) ? gm.parry_animation.filter(item => typeof item === "string" && item.trim()) : [];
                    if (animations.length === 0 && typeof gm.guard === "string" && gm.guard.trim()) animations.push(gm.guard);
                    return weaponCategories.length > 0 && animations.length > 0 ? { weaponCategories, style: firstDefined(gm.style, "common"), animations } : null;
                }).filter(Boolean);
            }

            if (Array.isArray(out.weaponLivingMotions)) {
                out.weaponLivingMotions = out.weaponLivingMotions.filter(item => isPlainObject(item) && Array.isArray(item.weaponCategories) && item.weaponCategories.length > 0 && isPlainObject(item.livingMotions));
            }
            if (Array.isArray(out.guardHitAnimation)) {
                out.guardHitAnimation = out.guardHitAnimation.filter(item => isPlainObject(item) && Array.isArray(item.weaponCategories) && item.weaponCategories.length > 0 && Array.isArray(item.animations) && item.animations.length > 0);
            }
            out.combatBehaviors = data.combatBehaviors !== undefined ? normalizeCurrentCombatBehaviors(data.combatBehaviors) : convertLegacyCombatBehaviors(data);
            for (const field of ["attributes", "weaponLivingMotions", "guardHitAnimation"]) if (Array.isArray(out[field]) && out[field].length === 0) delete out[field];
            if (out.combatBehaviors.length === 0) throw new Error("转换后没有有效的 combatBehaviors");
            return out;
        }

        function customStringify(obj, indentLevel = 0) {
            if (obj === undefined) return undefined;
            if (obj === null) return "null";
            
            const indent = "\t".repeat(indentLevel);
            const nextIndent = "\t".repeat(indentLevel + 1);
            
            if (Array.isArray(obj)) {
                if (obj.length === 0) return "[]";
                let allSimple = obj.every(item => typeof item !== 'object' || item === null);
                if (allSimple) {
                    return "[" + obj.map(item => JSON.stringify(item)).join(", ") + "]";
                }
                
                let items = [];
                for (let i = 0; i < obj.length; i++) {
                    let itemStr = "";
                    let item = obj[i];
                    if (typeof item === 'object' && item !== null && !Array.isArray(item)) {
                        if (Object.keys(item).length <= 4 && !Object.values(item).some(v => typeof v === 'object' && v !== null)) {
                            itemStr = JSON.stringify(item);
                        } else {
                            itemStr = customStringify(item, indentLevel + 1);
                        }
                    } else {
                        itemStr = customStringify(item, indentLevel + 1);
                    }
                    
                    if (itemStr !== undefined) {
                        items.push(nextIndent + itemStr);
                    } else {
                        items.push(nextIndent + "null");
                    }
                }
                return "[\n" + items.join(",\n") + "\n" + indent + "]";
            } else if (typeof obj === 'object') {
                let keys = Object.keys(obj);
                if (keys.length === 0) return "{}";
                
                let items = [];
                for (let i = 0; i < keys.length; i++) {
                    let key = keys[i];
                    let valStr = customStringify(obj[key], indentLevel + 1);
                    if (valStr === undefined) continue;
                    
                    items.push(nextIndent + JSON.stringify(key) + ": " + valStr);
                }
                if (items.length === 0) return "{}";
                return "{\n" + items.join(",\n") + "\n" + indent + "}";
            } else {
                return JSON.stringify(obj);
            }
        }

        function getFirstJsonChar(text) {
            if (typeof text !== 'string') return '';
            let s = text.replace(/^\uFEFF/, '');
            for (let i = 0; i < s.length; i++) {
                const c = s[i];
                if (c === ' ' || c === '\n' || c === '\r' || c === '\t') continue;
                return c;
            }
            return '';
        }

        async function convertJsonTextToCE(text, fileName = "unknown.json") {
            const c = getFirstJsonChar(text.slice(0, 4096));
            if (c !== '{' && c !== '[') {
                throw new Error("文件内容不像 JSON（开头未发现 { 或 [）");
            }
            let json = JSON.parse(text);
            validateSchema(json);
            
            let ceJson = convertData(json);
            let jsonStr = customStringify(ceJson);
            
            return { jsonStr, fileName };
        }

    <script>
        let selectedFiles = [];
        let failedFiles = [];
        let totalCount = 0;
        let processedCount = 0;
        let isProcessing = false;
        let workerObjectUrl = null;
        let abortRequested = false;
        const fileState = new Map();
        let runStartMs = 0;
        const FILE_SIZE_WARN_BYTES = 20 * 1024 * 1024;

        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');
            const prefixInput = document.getElementById('prefixInput');
            const suffixInput = document.getElementById('suffixInput');
            initTheme();
            initConfig(prefixInput, suffixInput);
            initHotkeys();
            initSoundToggle();
            initContextMenu();
            initMobileFocusAssist();

            dropZone.addEventListener('click', () => fileInput.click());
            
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
            
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });
            
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                handleFiles(e.dataTransfer.files).catch(err => log(`读取文件失败: ${err?.message || err}`, "error"));
            });
            
            fileInput.addEventListener('change', (e) => {
                handleFiles(e.target.files).catch(err => log(`读取文件失败: ${err?.message || err}`, "error"));
                fileInput.value = ''; // Reset to allow re-selecting same files
            });
        });

        function formatBytes(bytes) {
            const n = typeof bytes === 'number' ? bytes : 0;
            if (!Number.isFinite(n) || n <= 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB'];
            const idx = Math.min(units.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
            const v = n / Math.pow(1024, idx);
            const fixed = v >= 100 || idx === 0 ? 0 : (v >= 10 ? 1 : 2);
            return `${v.toFixed(fixed)} ${units[idx]}`;
        }


        async function looksLikeJsonFile(file) {
            if (!file || typeof file.slice !== 'function') return false;
            try {
                const head = await file.slice(0, 4096).text();
                const c = getFirstJsonChar(head);
                return c === '{' || c === '[';
            } catch {
                return false;
            }
        }

        async function handleFiles(files) {
            let added = 0;
            const arr = Array.from(files || []);
            for (let file of arr) {
                const name = (file && file.name) ? file.name : '';
                if (!name.toLowerCase().endsWith('.json')) {
                    log(`已忽略非 JSON 文件: ${name || '(未知文件名)'}`, "info");
                    continue;
                }
                if (typeof file.size === 'number' && file.size >= FILE_SIZE_WARN_BYTES) {
                    log(`文件较大（${formatBytes(file.size)}），转换可能会卡顿: ${name}`, "warn");
                }
                const likely = await looksLikeJsonFile(file);
                if (!likely) {
                    log(`已忽略疑似非 JSON 内容的文件: ${name}`, "error");
                    continue;
                }
                if (!selectedFiles.some(f => f.name === file.name && f.size === file.size)) {
                    selectedFiles.push(file);
                    setFileStatus(file, 'selected');
                    added++;
                }
            }
            if (added > 0) renderFileList();
        }

        function makeFileKey(file) {
            const lm = typeof file.lastModified === 'number' ? file.lastModified : 0;
            return `${file.name}::${file.size}::${lm}`;
        }

        function getFileStatus(file) {
            const key = makeFileKey(file);
            const entry = fileState.get(key);
            return entry && typeof entry === 'object' ? entry : { status: 'selected', detail: '' };
        }

        function setFileStatus(file, status, detail = '') {
            const key = makeFileKey(file);
            fileState.set(key, { status, detail: detail || '' });
        }

        function deleteFileStatus(file) {
            const key = makeFileKey(file);
            fileState.delete(key);
        }

        function renderFileList() {
            const list = document.getElementById('fileList');
            if (selectedFiles.length === 0) {
                list.style.display = 'none';
                return;
            }
            list.style.display = 'block';
            list.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const st = getFileStatus(file);
                const tagText = st.status === 'processing' ? t('处理中') : (st.status === 'success' ? t('成功') : (st.status === 'failed' ? t('失败') : (st.status === 'canceled' ? t('已取消') : t('已选'))));
                const tagClass = st.status === 'processing' ? 'tag-processing' : (st.status === 'success' ? 'tag-success' : (st.status === 'failed' ? 'tag-failed' : (st.status === 'canceled' ? 'tag-canceled' : 'tag-selected')));
                const canRemove = !isProcessing && st.status !== 'processing';
                const div = document.createElement('div');
                div.className = 'file-item';
                div.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    showContextMenu(e.clientX, e.clientY, index);
                });
                div.innerHTML = `
                    <span class="file-meta">
                        <span class="tag ${tagClass}">${tagText}</span>
                        <span class="file-name">📄 ${file.name} <span class="muted" style="font-size:12px;">(${(file.size/1024).toFixed(1)} KB)</span></span>
                    </span>
                    <button class="file-remove" onclick="removeFile(${index}, event)" title="${t('移除')}" ${canRemove ? '' : 'disabled'} style="${canRemove ? '' : 'opacity:0.5; cursor:not-allowed;'}">✖</button>
                `;
                list.appendChild(div);
            });
        }

        function removeFile(index, event) {
            event.stopPropagation();
            if (isProcessing) return;
            const f = selectedFiles[index];
            if (f) deleteFileStatus(f);
            selectedFiles.splice(index, 1);
            renderFileList();
        }

        function clearLog() {
            document.getElementById('log').innerHTML = `<span class="log-line info"><span class="log-icon">•</span><span class="log-text">${t('日志已清空。')}</span></span>`;
            document.getElementById('progressText').textContent = '';
            processedCount = 0;
            totalCount = 0;
            failedFiles = [];
            document.getElementById('retryBtn').style.display = 'none';
        }

        function clearAll() {
            if (isProcessing) return;
            selectedFiles = [];
            failedFiles = [];
            totalCount = 0;
            processedCount = 0;
            fileState.clear();
            document.getElementById('retryBtn').style.display = 'none';
            updateProgress();
            renderFileList();
            clearLog();
        }

        function cancelConversion() {
            if (!isProcessing) return;
            abortRequested = true;
            isDownloading = false;
            runStartMs = 0;
            if (Array.isArray(selectedFiles)) {
                for (const f of selectedFiles) {
                    const st = getFileStatus(f);
                    if (st.status === 'processing') setFileStatus(f, 'canceled');
                }
            }
            cleanupAfterRun();
            totalCount = 0;
            processedCount = 0;
            updateProgress();
            setProcessingState(false);
            log('已取消转换。', 'info');
        }

        function updateProgress() {
            const pt = document.getElementById('progressText');
            if (totalCount > 0) {
                const elapsed = isProcessing && runStartMs > 0 ? ` | 用时: ${formatDuration(performance.now() - runStartMs)}` : '';
                pt.textContent = `进度: ${processedCount} / ${totalCount}${elapsed}`;
            } else {
                pt.textContent = '';
            }
        }

        function formatDuration(ms) {
            const n = typeof ms === 'number' ? ms : 0;
            if (!Number.isFinite(n) || n <= 0) return '0s';
            const s = n / 1000;
            if (s < 60) return `${s.toFixed(s >= 10 ? 1 : 2)}s`;
            const m = Math.floor(s / 60);
            const rs = s - m * 60;
            return `${m}m ${rs.toFixed(0)}s`;
        }

        function log(msg, type='info') {
            const logDiv = document.getElementById('log');
            const line = document.createElement('span');
            line.className = `log-line ${type}`;
            const icon = document.createElement('span');
            icon.className = 'log-icon';
            icon.textContent = type === 'success' ? '✓' : (type === 'error' ? '✕' : (type === 'warn' ? '!' : '•'));
            const text = document.createElement('span');
            text.className = 'log-text';
            const prefix = `[${new Date().toLocaleTimeString()}] `;
            const full = prefix + (msg ?? '');
            const maxLen = 320;
            if (typeof full === 'string' && full.length > maxLen) {
                const short = full.slice(0, maxLen) + '…';
                text.textContent = short;
                const btn = document.createElement('button');
                btn.className = 'log-more';
                btn.type = 'button';
                btn.textContent = '展开';
                let expanded = false;
                btn.addEventListener('click', () => {
                    expanded = !expanded;
                    text.textContent = expanded ? full : short;
                    btn.textContent = expanded ? '收起' : '展开';
                });
                line.appendChild(icon);
                line.appendChild(text);
                line.appendChild(btn);
                logDiv.appendChild(line);
                logDiv.scrollTop = logDiv.scrollHeight;
                return;
            }
            text.textContent = full;
            line.appendChild(icon);
            line.appendChild(text);
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function setProcessingState(next) {
            isProcessing = !!next;
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');
            const prefixInput = document.getElementById('prefixInput');
            const suffixInput = document.getElementById('suffixInput');
            const convertBtn = document.getElementById('convertBtn');
            const retryBtn = document.getElementById('retryBtn');
            const clearLogBtn = document.getElementById('clearLogBtn');

            if (isProcessing) {
                dropZone.classList.add('disabled');
                fileInput.disabled = true;
                prefixInput.disabled = true;
                suffixInput.disabled = true;
                convertBtn.disabled = true;
                convertBtn.classList.add('loading');
                retryBtn.disabled = true;
                clearLogBtn.disabled = true;
            } else {
                dropZone.classList.remove('disabled');
                fileInput.disabled = false;
                prefixInput.disabled = false;
                suffixInput.disabled = false;
                convertBtn.disabled = false;
                convertBtn.classList.remove('loading');
                retryBtn.disabled = false;
                clearLogBtn.disabled = false;
            }
            renderFileList();
        }

        function updateThemeToggleLabel(mode) {
            const btn = document.getElementById('themeToggle');
            if (!btn) return;
            const label = lang === 'zh'
                ? (mode === 'dark' ? '深色' : (mode === 'light' ? '浅色' : '自动'))
                : (mode === 'dark' ? 'Dark' : (mode === 'light' ? 'Light' : 'Auto'));
            btn.textContent = (lang === 'zh' ? '主题: ' : 'Theme: ') + label;
        }

        function applyThemeMode(mode) {
            const m = mode === 'dark' ? 'dark' : (mode === 'light' ? 'light' : 'auto');
            if (m === 'auto') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', m);
            }
            localStorage.setItem('ce_converter_theme_mode', m);
            updateThemeToggleLabel(m);
        }

        function initTheme() {
            const mode = localStorage.getItem('ce_converter_theme_mode') || 'auto';
            applyThemeMode(mode);
        }

        function toggleTheme() {
            const current = localStorage.getItem('ce_converter_theme_mode') || 'auto';
            const next = current === 'auto' ? 'light' : (current === 'light' ? 'dark' : 'auto');
            applyThemeMode(next);
        }

        function initConfig(prefixInput, suffixInput) {
            const savedPrefix = localStorage.getItem('ce_converter_output_prefix');
            const savedSuffix = localStorage.getItem('ce_converter_output_suffix');
            if (typeof savedPrefix === 'string') prefixInput.value = savedPrefix;
            if (typeof savedSuffix === 'string') suffixInput.value = savedSuffix;
            prefixInput.addEventListener('input', () => localStorage.setItem('ce_converter_output_prefix', prefixInput.value));
            suffixInput.addEventListener('input', () => localStorage.setItem('ce_converter_output_suffix', suffixInput.value));
        }

        function initSoundToggle() {
            const key = 'ce_converter_done_sound';
            const el = document.getElementById('soundToggle');
            if (!el) return;
            const saved = localStorage.getItem(key);
            el.checked = saved === '1';
            el.addEventListener('change', () => {
                localStorage.setItem(key, el.checked ? '1' : '0');
            });
        }

        function shouldPlayDoneSound() {
            return localStorage.getItem('ce_converter_done_sound') === '1';
        }

        function playDoneSound() {
            if (!shouldPlayDoneSound()) return;
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            const ctx = new Ctx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 880;
            gain.gain.value = 0.0001;
            osc.connect(gain);
            gain.connect(ctx.destination);
            const t0 = ctx.currentTime;
            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.exponentialRampToValueAtTime(0.25, t0 + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
            osc.start(t0);
            osc.stop(t0 + 0.2);
            osc.onended = () => ctx.close().catch(() => {});
        }

        function initMobileFocusAssist() {
            document.addEventListener('focusin', (e) => {
                const t = e.target;
                if (!(t instanceof HTMLElement)) return;
                if (t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA') return;
                const isMobile = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
                if (!isMobile) return;
                setTimeout(() => {
                    try {
                        t.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
                    } catch {}
                }, 50);
            });
        }

        function initContextMenu() {
            const menu = document.getElementById('contextMenu');
            if (!menu) return;
            const btnRemove = document.getElementById('ctxRemove');
            const btnClear = document.getElementById('ctxClear');

            const hide = () => {
                menu.style.display = 'none';
                menu.dataset.index = '';
            };

            btnRemove.addEventListener('click', () => {
                if (isProcessing) return hide();
                const idx = Number(menu.dataset.index);
                if (Number.isFinite(idx)) removeFile(idx, { stopPropagation() {} });
                hide();
            });
            btnClear.addEventListener('click', () => {
                if (isProcessing) return hide();
                clearAll();
                hide();
            });

            document.addEventListener('click', (e) => {
                if (menu.style.display !== 'none' && !menu.contains(e.target)) hide();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') hide();
            });
            window.addEventListener('blur', hide);

            window.showContextMenu = (x, y, index) => {
                if (isProcessing) return;
                menu.dataset.index = String(index);
                btnRemove.disabled = !(index >= 0 && index < selectedFiles.length);
                btnClear.disabled = selectedFiles.length === 0;
                menu.style.display = 'block';
                const rect = menu.getBoundingClientRect();
                const maxX = Math.max(8, window.innerWidth - rect.width - 8);
                const maxY = Math.max(8, window.innerHeight - rect.height - 8);
                const nx = Math.min(Math.max(8, x), maxX);
                const ny = Math.min(Math.max(8, y), maxY);
                menu.style.left = `${nx}px`;
                menu.style.top = `${ny}px`;
            };
        }

        function sanitizeFileNamePart(part) {
            const s = String(part ?? '');
            const cleaned = s
                .replace(/[\\\/:\*\?"<>\|\u0000-\u001F]/g, '_')
                .replace(/\s+/g, ' ')
                .trim()
                .replace(/[. ]+$/g, '');
            if (!cleaned) return '';
            return cleaned.length > 120 ? cleaned.slice(0, 120) : cleaned;
        }

        function makeSafeDownloadName(prefix, baseName, suffix) {
            const p = sanitizeFileNamePart(prefix);
            const b = sanitizeFileNamePart(baseName) || 'converted';
            const s = sanitizeFileNamePart(suffix);
            const joined = `${p}${b}${s}`;
            const safe = sanitizeFileNamePart(joined) || 'converted';
            return `${safe}.json`;
        }

        function isTypingInInput(target) {
            const el = target;
            const tag = el && el.tagName ? el.tagName.toLowerCase() : '';
            return tag === 'input' || tag === 'textarea' || (el && el.isContentEditable);
        }

        function initHotkeys() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    if (isTypingInInput(e.target)) return;
                    if (!isProcessing) processFiles();
                } else if (e.key === 'Escape') {
                    if (isProcessing) {
                        cancelConversion();
                    } else {
                        clearAll();
                    }
                }
            });

            document.addEventListener('paste', (e) => {
                const files = e.clipboardData && e.clipboardData.files ? e.clipboardData.files : null;
                if (files && files.length > 0) {
                    handleFiles(files).catch(err => log(`读取文件失败: ${err?.message || err}`, "error"));
                }
            });
        }


        // --- Web Worker Code ---
        const workerCode = `
            self.onmessage = async function(e) {
                const file = e.data.file;
                const jobId = e.data.jobId;
                try {
                    let text = await file.text();
                    let { jsonStr, fileName } = await convertJsonTextToCE(text, file.name);
                    
                    self.postMessage({ success: true, jobId: jobId, fileName: fileName, jsonStr: jsonStr });
                    jsonStr = null;
                } catch (err) {
                    self.postMessage({ success: false, jobId: jobId, fileName: file.name, error: err.message });
                }
            };
        `;

        let myWorker = null;
        let downloadQueue = [];
        let isDownloading = false;
        let filesToProcess = [];
        let currentProcessingIndex = 0;
        let resendFilesQueue = [];
        let inFlightJobs = new Map();
        let inFlightOrder = [];
        let nextJobId = 1;

        function processDownloadQueue() {
            if (abortRequested) {
                downloadQueue.length = 0;
                isDownloading = false;
                return;
            }
            if (isDownloading || downloadQueue.length === 0) return;
            isDownloading = true;
            
            let item = downloadQueue.shift();
            let jsonStr = item && typeof item.jsonStr === 'string' ? item.jsonStr : '';
            if (item) item.jsonStr = null;
            
            let blob = new Blob([jsonStr], { type: "application/json" });
            jsonStr = null;
            let url = URL.createObjectURL(blob);
            
            let a = document.createElement('a');
            a.href = url;
            
            let prefix = document.getElementById('prefixInput').value.trim();
            let suffix = document.getElementById('suffixInput').value.trim();
            let baseName = item.fileName.replace(/\.json$/i, '');
            let newName = makeSafeDownloadName(prefix, baseName, suffix);
            
            a.download = newName;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            URL.revokeObjectURL(url);
            a.href = '';
            log(`成功转换并下载: ${item.fileName} -> ${newName}`, "success");
            
            setTimeout(() => {
                isDownloading = false;
                processDownloadQueue();
                maybeFinishProcessing();
            }, 150);
        }

        function cleanupAfterRun() {
            downloadQueue.length = 0;
            resendFilesQueue.length = 0;
            filesToProcess.length = 0;
            currentProcessingIndex = 0;
            inFlightJobs.clear();
            inFlightOrder.length = 0;

            if (myWorker) {
                myWorker.terminate();
                myWorker = null;
            }
            if (workerObjectUrl) {
                URL.revokeObjectURL(workerObjectUrl);
                workerObjectUrl = null;
            }
        }

        function removeInFlightOrder(jobId) {
            const idx = inFlightOrder.indexOf(jobId);
            if (idx >= 0) inFlightOrder.splice(idx, 1);
        }

        function createWorker() {
            if (myWorker) {
                myWorker.terminate();
            }
            if (workerObjectUrl) {
                URL.revokeObjectURL(workerObjectUrl);
                workerObjectUrl = null;
            }
            
            const coreScript = document.getElementById('ce-converter-core').textContent;
            const fullWorkerCode = coreScript + '\n' + workerCode;
            const blob = new Blob([fullWorkerCode], { type: 'application/javascript' });
            
            try {
                workerObjectUrl = URL.createObjectURL(blob);
                myWorker = new Worker(workerObjectUrl);
                URL.revokeObjectURL(workerObjectUrl);
                workerObjectUrl = null;
            } catch (err) {
                log(`Worker 初始化失败（可能被 CSP 拦截），将使用主线程顺序转换: ${err?.message || err}`, "error");
                myWorker = null;
                return false;
            }
            
            myWorker.onmessage = function(e) {
                const result = e.data;
                const jobId = result && typeof result.jobId === 'number' ? result.jobId : null;
                const originalFile = jobId !== null ? inFlightJobs.get(jobId) : null;
                if (jobId !== null) {
                    inFlightJobs.delete(jobId);
                    removeInFlightOrder(jobId);
                }
                if (abortRequested) {
                    if (originalFile) setFileStatus(originalFile, 'canceled');
                    renderFileList();
                    return;
                }
                processedCount++;
                updateProgress();

                if (result.success) {
                    if (originalFile) setFileStatus(originalFile, 'success');
                    downloadQueue.push({ fileName: result.fileName, jsonStr: result.jsonStr });
                    processDownloadQueue();
                } else {
                    if (originalFile) failedFiles.push(originalFile);
                    if (originalFile) setFileStatus(originalFile, 'failed', result.error || '');
                    log(`转换失败: ${result.fileName} (错误: ${result.error})`, "error");
                    document.getElementById('retryBtn').style.display = 'inline-block';
                }
                
                sendNextBatch();
                renderFileList();
                maybeFinishProcessing();
            };
            
            myWorker.onerror = function(err) {
                log(`Worker 发生系统级错误或崩溃: ${err.message}`, "error");
                const suspectedJobId = inFlightOrder.length > 0 ? inFlightOrder[inFlightOrder.length - 1] : null;
                if (suspectedJobId !== null) {
                    const suspectedFile = inFlightJobs.get(suspectedJobId);
                    inFlightJobs.delete(suspectedJobId);
                    inFlightOrder.pop();
                    if (suspectedFile) {
                        failedFiles.push(suspectedFile);
                        setFileStatus(suspectedFile, 'failed', err?.message || 'Worker 崩溃');
                        document.getElementById('retryBtn').style.display = 'inline-block';
                        processedCount++;
                        updateProgress();
                    }
                }

                const toResend = [];
                for (const jid of inFlightOrder) {
                    const f = inFlightJobs.get(jid);
                    if (f) toResend.push(f);
                }
                inFlightJobs.clear();
                inFlightOrder.length = 0;
                resendFilesQueue = toResend.concat(resendFilesQueue);

                const ok = createWorker();
                if (!ok) {
                    const remaining = resendFilesQueue.concat(filesToProcess.slice(currentProcessingIndex));
                    resendFilesQueue = [];
                    filesToProcess = [];
                    currentProcessingIndex = 0;
                    convertInMainThread(remaining);
                    return;
                }

                while (inFlightJobs.size < 3) {
                    const sent = sendNextBatch();
                    if (!sent) break;
                }
                renderFileList();
                maybeFinishProcessing();
            };
            return true;
        }

        function sendNextBatch() {
            if (!myWorker) return false;
            if (abortRequested) return false;
            let file = null;
            if (resendFilesQueue.length > 0) {
                file = resendFilesQueue.shift();
            } else if (currentProcessingIndex < filesToProcess.length) {
                file = filesToProcess[currentProcessingIndex];
                currentProcessingIndex++;
            } else {
                return false;
            }
            const jobId = nextJobId++;
            inFlightJobs.set(jobId, file);
            inFlightOrder.push(jobId);
            myWorker.postMessage({ file, jobId });
            return true;
        }

        function triggerWorker(files) {
            filesToProcess = files;
            currentProcessingIndex = 0;
            resendFilesQueue = [];
            inFlightJobs.clear();
            inFlightOrder.length = 0;
            nextJobId = 1;
            
            const ok = createWorker();
            if (!ok) {
                convertInMainThread(filesToProcess);
                return;
            }
            
            // 初始启动发送几个并行（比如 3 个），后续在 onmessage 里继续发送
            let initialBatch = Math.min(3, files.length);
            for (let i = 0; i < initialBatch; i++) {
                sendNextBatch();
            }
        }

        async function convertInMainThread(files) {
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (abortRequested) {
                    setFileStatus(file, 'canceled');
                    processedCount++;
                    updateProgress();
                    continue;
                }
                setFileStatus(file, 'processing');
                renderFileList();
                try {
                    let text = await file.text();
                    let { jsonStr, fileName } = await convertJsonTextToCE(text, file.name);
                    processedCount++;
                    updateProgress();
                    setFileStatus(file, 'success');
                    downloadQueue.push({ fileName, jsonStr });
                    processDownloadQueue();
                } catch (err) {
                    processedCount++;
                    updateProgress();
                    failedFiles.push(file);
                    setFileStatus(file, 'failed', err?.message || String(err));
                    log(`转换失败: ${file.name} (错误: ${err?.message || err})`, "error");
                    document.getElementById('retryBtn').style.display = 'inline-block';
                }
            }
            maybeFinishProcessing();
        }



        function maybeFinishProcessing() {
            const allResultsReceived = totalCount > 0 && processedCount >= totalCount;
            if (!allResultsReceived) return;
            const noPendingDownloads = downloadQueue.length === 0 && !isDownloading;
            if (!noPendingDownloads) return;
            const duration = runStartMs > 0 ? performance.now() - runStartMs : 0;
            runStartMs = 0;
            cleanupAfterRun();
            setProcessingState(false);
            const summaryType = failedFiles.length > 0 ? "error" : "success";
            const timeText = duration > 0 ? ` ${t('总耗时:')} ${formatDuration(duration)}` : '';
            log(`${t('全部完成！成功:')} ${totalCount - failedFiles.length} ${t('失败:')} ${failedFiles.length}${timeText}`, summaryType);
            playDoneSound();
            updateProgress();
        }

        function processFiles() {
            if (isProcessing) {
                log(t("处理中...禁止重复点击"), "info");
                return;
            }
            if (selectedFiles.length === 0) {
                log(t("请先选择要转换的文件。"), "error");
                return;
            }

            abortRequested = false;
            failedFiles = [];
            document.getElementById('retryBtn').style.display = 'none';
            totalCount = selectedFiles.length;
            processedCount = 0;
            runStartMs = performance.now();
            updateProgress();
            for (const f of selectedFiles) setFileStatus(f, 'processing');
            renderFileList();

            log(`${t('开始批量转换')} ${totalCount} ${t('个文件 (启用异步加速)...')}`, "info");
            setProcessingState(true);
            triggerWorker(selectedFiles);
        }

        function retryFailed() {
            if (isProcessing) {
                log(t("处理中...禁止重复点击"), "info");
                return;
            }
            if (failedFiles.length === 0) return;
            const filesToRetry = [...failedFiles];
            failedFiles = [];
            document.getElementById('retryBtn').style.display = 'none';
            
            abortRequested = false;
            totalCount = filesToRetry.length;
            processedCount = 0;
            runStartMs = performance.now();
            updateProgress();
            for (const f of filesToRetry) setFileStatus(f, 'processing');
            renderFileList();

            log(`${t('重试')} ${totalCount} ${t('个失败文件...')}`, "info");
            setProcessingState(true);
            triggerWorker(filesToRetry);
        }
    </script>
</body>
